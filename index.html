/* to-scale map around Vijayawada. Rings every 10 km. Places beyond the map edge sit on the rim with their distance. */
function mapSVG(selId){
  var W=560,H=460,cx=W/2,cy=H/2,maxKm=40,sc=(Math.min(cx,cy)-34)/maxKm,kLat=111.2,kLng=111.2*Math.cos(CENTER.lat*Math.PI/180),g="";
  for(var k=10;k<=maxKm;k+=10){g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(k*sc).toFixed(1)+'" fill="none" stroke="var(--ring)" stroke-dasharray="3 5"/><text x="'+(cx+4)+'" y="'+(cy-k*sc-4).toFixed(1)+'">'+k+' km</text>'}
  g+='<text x="'+(W-24)+'" y="18" text-anchor="middle">N</text><path d="M'+(W-24)+' 22l-4 10h8z" fill="var(--muted)"/>';
  function place(lat,lng){var dx=(lng-CENTER.lng)*kLng,dy=(lat-CENTER.lat)*kLat,d=Math.sqrt(dx*dx+dy*dy),f=d>maxKm?maxKm/d:1;
    return {x:cx+dx*f*sc,y:cy-dy*f*sc,d:d,edge:d>maxKm}}
  Object.keys(LANDMARKS).forEach(function(key){var L=LANDMARKS[key],q=place(L.lat,L.lng);
    if(key==="vja"){g+='<g class="lm"><rect x="'+(cx-6)+'" y="'+(cy-6)+'" width="12" height="12" fill="var(--deep)" transform="rotate(45 '+cx+' '+cy+')"/><text x="'+(cx+11)+'" y="'+(cy+15)+'" font-weight="700">Vijayawada</text></g>';return}
    if(key==="mgl")return;
    var a=q.x>W*.62?"end":"start",dx=a==="end"?-8:8,label=q.edge?L.name+" · "+Math.round(q.d)+" km":L.name;
    g+='<g class="lm"><circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="3.5" fill="var(--muted)"/><text x="'+(q.x+dx).toFixed(1)+'" y="'+(q.y+4).toFixed(1)+'" text-anchor="'+a+'">'+esc(label)+'</text></g>'});
  PROJECTS.forEach(function(p){if(!p.mapped)return;var q=place(p.lat,p.lng),a=q.x>W*.62?"end":"start",dx=a==="end"?-13:13;
    g+='<g class="pin'+(p.id===selId?' sel':'')+'" data-id="'+p.id+'" tabindex="0" role="link" aria-label="'+esc(p.name+", "+p.area)+'"><circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="9"/><text x="'+(q.x+dx).toFixed(1)+'" y="'+(q.y+4).toFixed(1)+'" text-anchor="'+a+'">'+esc(p.area)+'</text></g>'});
  return '<svg class="map" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Map of project locations around Vijayawada">'+g+'</svg>';
}

/* ---------- views ---------- */

  '<span class="eyebrow">Featured Project</span><h3>'+esc(p.name)+'</h3><div class="loc">'+esc(p.place)+'</div>'+
  (p.tagline?'<div class="tag">'+esc(p.tagline)+'</div>':'')+

function sorted(list){var l=list.slice();if(state.sort==="asc")l.sort(function(a,b){return a.rate-b.rate});if(state.sort==="desc")l.sort(function(a,b){return b.rate-a.rate});return l}

function renderDetail(p){
  var h='<div class="w"><button class="btn back" id="back">← All projects</button>';
  h+='<div class="dhead"><div class="dart">'+art(p,640,380)+'</div><div class="dtitle"><span class="eyebrow">Featured Project</span><h1>'+esc(p.name)+'</h1><div class="loc" style="font-size:16px">'+esc(p.place)+(p.district?" · "+esc(p.district):"")+'</div>'+(p.tagline?'<div class="tag" style="font-size:15px">'+esc(p.tagline)+'</div>':'')+'<p>'+esc(p.summary)+'</p><div class="approved">'+esc(p.approval)+'</div>'+
  '<div style="display:flex;flex-wrap:wrap;gap:8px"><a class="btn solid" target="_blank" rel="noopener" href="'+wa("Hello, I would like to enquire about "+p.name+" at "+p.area+".")+'">Enquire on WhatsApp</a>'+
  (p.mapped?'<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lng+'">Open in Google Maps</a>':'<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent("Bhogapuram, Andhra Pradesh")+'">Open Bhogapuram in Google Maps</a>')+'</div></div></div>';
  h+='<div class="facts"><div class="fact"><span>Plot information</span><b>'+esc(p.plot)+'</b></div><div class="fact"><span>Price</span><b>'+inr(p.rate)+' / Sq. Yd</b></div><div class="fact"><span>Region</span><b>'+esc(p.region==="Vizag"?"Vizag region":p.region+" region")+'</b></div></div>';
  h+='<section class="d"><h2>Location highlights</h2><ul class="ul">'+p.highlights.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></section>';

  h+='<section class="d"><h2>Around this location</h2><div class="cols">';
  if(p.mapped){
    var rows=p.near.map(function(k){var L=LANDMARKS[k];return [L.name,km(p.lat,p.lng,L.lat,L.lng)]}).sort(function(a,b){return a[1]-b[1]}),mx=Math.max.apply(null,rows.map(function(r){return r[1]}));
    h+='<div class="panel"><h3>Distance to key places</h3><p class="loc">Straight-line distances, approximate. Road distance is longer.</p><div class="near">'+rows.map(function(r){return '<div class="nrow"><div>'+esc(r[0])+'</div><div class="km">'+Math.round(r[1])+' km</div><div class="bar"><i style="width:'+Math.max(5,r[1]/mx*100)+'%"></i></div></div>'}).join("")+'</div></div>';
    h+='<div class="panel"><h3>Position on the map</h3><p class="loc">Among our projects, to scale.</p>'+mapSVG(p.id)+'</div>';
  }else{
    h+='<div class="panel"><h3>Nearby</h3><div class="near">'+p.facts.map(function(f){return '<div class="nrow"><div>'+esc(f[0])+'</div><div class="km">'+esc(f[1])+'</div></div>'}).join("")+'</div></div>';
    h+='<div class="panel"><h3>Why the area is in focus</h3><p>The new international airport is the anchor. It was inaugurated on 1 August 2026, handles about 6 million passengers a year in phase one, and is planned to grow in phases to 18 million. A 3,800 m runway and a cargo terminal are in place.</p></div>';
  }
  h+='</div><p class="srcs">Location facts are compiled from public sources: '+SOURCES.map(function(s){return '<a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+'</a>'}).join(", ")+'. Please confirm current details with our team.</p></section>';

  h+='<section class="d"><h2>Estimate your plot cost</h2><div class="panel"><div class="calc"><label for="yd">Plot size (Sq. Yds)<input id="yd" type="number" min="'+p.min+'" step="1" value="'+p.min+'"></label><div><span class="fine">Listed rate</span><br><b>'+inr(p.rate)+' / Sq. Yd</b></div><div><span class="fine">Indicative plot cost</span><br><output id="est" for="yd"></output></div></div><p class="fine" style="margin-top:10px">Indicative only, based on the listed rate. Final price, registration and other charges are confirmed by our team.</p></div></section>';

  h+='<section class="d"><h2>Request details for '+esc(p.name)+'</h2><div class="panel">'+formHTML(p.id)+'</div></section></div>'+footHTML();
  app.innerHTML=h;

  function upd(){var v=parseFloat(yd.value);est.textContent=v>0?inr(v*p.rate):"–"}
  yd.addEventListener("input",upd);upd();
  document.getElementById("back").addEventListener("click",function(){location.hash="home"});
}

/* ---------- routing and events ---------- */
function bind(){
  var cp=document.getElementById("cp");if(cp)cp.addEventListener("click",function(){copyText(CO.phone)});
  var f=document.getElementById("enq");
  if(f)f.addEventListener("submit",function(e){e.preventDefault();
    var g=function(i){return document.getElementById(i).value.trim()};
    var t="Hello, I am "+g("f-name")+" ("+g("f-phone")+")."+(g("f-loc")?" Preferred location: "+g("f-loc")+".":"")+(g("f-budget")?" Budget: "+g("f-budget")+".":"")+(g("f-req")?" Plot requirement: "+g("f-req")+".":"")+(g("f-msg")?" "+g("f-msg"):"");
    var w=window.open(wa(t),"_blank");if(!w)toast("Tap “Chat on WhatsApp” to continue")});
}
function route(scrollTo){
  var id=(location.hash||"").slice(1),p=byId(id);
  if(p)renderDetail(p);else renderHome();
  bind();
  var el=scrollTo&&document.getElementById(scrollTo);
  if(el)el.scrollIntoView({block:"start"});else window.scrollTo(0,0);
}
function go(sec){
  if(byId((location.hash||"").slice(1))){pending=sec;location.hash="home";return}
  var el=document.getElementById(sec);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
}
var pending=null;
window.addEventListener("hashchange",function(){var s=pending;pending=null;route(s)});

app.addEventListener("click",function(e){
  var t=e.target.closest("[data-open]");if(t){location.hash=t.dataset.open;return}
  t=e.target.closest(".pin");if(t){location.hash=t.dataset.id;return}
  t=e.target.closest("[data-region]");if(t){state.region=t.dataset.region;renderHome();bind();return}
  t=e.target.closest("[data-region-go]");if(t){state.region=t.dataset.regionGo;renderHome();bind();document.getElementById("sec-projects").scrollIntoView({block:"start"});return}
  t=e.target.closest("[data-go]");if(t){go(t.dataset.go)}
});
app.addEventListener("keydown",function(e){if(e.key==="Enter"){var t=e.target.closest&&e.target.closest(".pin");if(t)location.hash=t.dataset.id}});
app.addEventListener("change",function(e){if(e.target.id==="sort"){state.sort=e.target.value;renderHome();bind();document.getElementById("sec-projects").scrollIntoView({block:"start"})}});

/* header */
document.getElementById("callTop").href="tel:"+CO.phone;
document.getElementById("waTop").href=wa("Hello, I would like to know more about your projects.");
document.getElementById("waFab").href=wa("Hello, I would like to know more about your projects.");
document.getElementById("callTop").addEventListener("click",function(){toast("Call "+CO.phone)});
var NAV=[["Projects","sec-projects"],["Map","sec-map"],["Locations","sec-locations"],["Why open plots","sec-why"],["Process","sec-process"],["Contact","sec-contact"]];
document.getElementById("nav").innerHTML=NAV.map(function(n){return '<button data-nav="'+n[1]+'">'+n[0]+'</button>'}).join("");
document.getElementById("nav").addEventListener("click",function(e){var b=e.target.closest("[data-nav]");if(b)go(b.dataset.nav)});
route();
</script>
